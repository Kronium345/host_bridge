services:
  - type: web
    name: host-bridge
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_VERIFIED_EMAIL
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
    autoDeploy: true

