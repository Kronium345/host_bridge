{% extends "base.html" %}

{% block content %}
<section class="reset-section">
    <h1 style="margin:0 0 12px;">Reset your password</h1>
    <p class="muted">Enter the email associated with your account and we'll send you a reset link.</p>
    <form method="post" class="reset-form" id="forgot-password-form">
        <input type="email" name="email" placeholder="Email" class="reset-input" required>
        <button type="submit" class="reset-btn">Send reset link</button>
    </form>
    <div style="margin-top: 20px; text-align: center;">
        <a href="{{ url_for('login') }}" style="color: #2E8B57; text-decoration: none;">← Back to Login</a>
    </div>
</section>

{% if send_email %}
<!-- Auto-send password reset email via EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
    (function () {
        emailjs.init('{{ EMAILJS_PUBLIC }}');

        // Send password reset email
        const templateParams = {
            to_email: '{{ user_email }}',
            user_name: '{{ user_name }}',
            reset_url: '{{ reset_url }}',
            from_name: 'HostBridge Support'
        };

        emailjs.send('{{ EMAILJS_SERVICE }}', '{{ EMAILJS_PASSWORD_RESET_TEMPLATE }}', templateParams)
            .then(function (response) {
                console.log('Password reset email sent successfully!', response.status, response.text);
                // Redirect to login after sending
                setTimeout(function () {
                    window.location.href = '{{ url_for("login") }}';
                }, 2000);
            }, function (error) {
                console.error('Failed to send password reset email:', error);
                alert('Failed to send reset email. Please try again.');
            });
    })();
</script>
{% endif %}
{% endblock %}
