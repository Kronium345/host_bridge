{% extends "base.html" %}

{% block content %}
<section class="reset-section">
    <h1 style="margin:0 0 12px;">Create a New Password</h1>
    <p class="muted">Please enter your new password below.</p>
    <form method="post" action="{{ url_for('reset_password', token=token) }}" class="reset-form">
        <input type="password" name="password" placeholder="New Password" class="reset-input" required minlength="6">
        <input type="password" name="confirm_password" placeholder="Confirm New Password" class="reset-input" required
            minlength="6">
        <button type="submit" class="reset-btn">Reset Password</button>
    </form>
    <div style="margin-top: 20px; text-align: center;">
        <a href="{{ url_for('login') }}" style="color: #2E8B57; text-decoration: none;">← Back to Login</a>
    </div>
</section>
{% endblock %}
